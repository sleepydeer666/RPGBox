<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>透明化抠图 v2</title>
<style>
:root{color:#eef2ec;background:#111411;font-family:"Microsoft YaHei",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#252b25,#111411)}body{padding:20px}.app{max-width:1280px;margin:auto}.head{margin-bottom:16px}.kicker{margin:0;color:#91bd9a;font-size:11px;letter-spacing:.12em}h1{margin:4px 0;font-size:28px}.sub{margin:0;color:#aeb8af;font-size:13px}.shell{display:grid;grid-template-columns:320px 1fr;gap:16px}.panel,.preview{border:1px solid #435044;border-radius:8px;background:#171c18;padding:16px}.panel{display:grid;align-content:start;gap:13px}.picker,.download,.seg button{min-height:40px;border:1px solid #435044;border-radius:6px;background:#202720;color:inherit;cursor:pointer}.picker{display:grid;place-items:center}.picker input{display:none}.group{display:grid;gap:6px}.label{color:#bdc8be;font-size:12px}.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.seg button{min-height:32px;font-size:12px}.seg button.active{border-color:#8dcc98;background:#31553a}.group input[type=range]{width:100%;accent-color:#88c991}.value{color:#91a298;font-size:12px}.download{font-size:14px}.download:disabled{opacity:.4;cursor:default}.meta{margin:0;display:grid;gap:7px;font-size:12px}.meta div{display:flex;justify-content:space-between;border:1px solid #2e3a30;border-radius:5px;padding:8px}.meta dt{color:#91a298}.meta dd{margin:0}.error{color:#ff9b8e;font-size:12px;margin:0}.preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.block{min-width:0}.title{color:#bdc8be;font-size:12px;margin-bottom:7px}.frame{position:relative;aspect-ratio:2/3;overflow:hidden;border:1px solid #39463b;border-radius:7px;background:#202520}.frame img,.frame canvas{width:100%;height:100%;object-fit:contain;display:block}.checker{background-image:linear-gradient(45deg,#363d36 25%,transparent 25%),linear-gradient(-45deg,#363d36 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#363d36 75%),linear-gradient(-45deg,transparent 75%,#363d36 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#8e998f;font-size:13px}.hint{color:#8e998f;font-size:11px;line-height:1.5;margin:0}@media(max-width:850px){body{padding:12px}.shell,.preview{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><header class="head"><p class="kicker">CHROMA KEY LAB / V2</p><h1>透明化抠图 v2</h1><p class="sub">色相 + 主色通道优势，适合非纯色或明暗渐变的 AI 生成背景。</p></header>
<main class="shell"><section class="panel"><label class="picker"><span id="fileLabel">导入图片</span><input id="file" type="file" accept="image/*"></label>
<div class="group"><div class="label">背景模式</div><div class="seg" id="screens"><button data-v="auto" class="active">auto</button><button data-v="green">green</button><button data-v="blue">blue</button><button data-v="red">red</button><button data-v="manual">manual</button></div></div>
<div class="group" id="manualGroup" hidden><div class="label">手动颜色</div><input id="manual" type="color" value="#00ff00"></div>
<div class="group"><label class="label" for="corner">角点采样</label><input id="corner" type="range" min="1" max="16" value="1"><span class="value" id="cornerV">1px</span></div>
<div class="group"><label class="label" for="cornerThreshold">角点容差</label><input id="cornerThreshold" type="range" min="0" max="60" value="20"><span class="value" id="cornerThresholdV">20</span></div>
<div class="group"><label class="label" for="tolerance">精确颜色容差</label><input id="tolerance" type="range" min="0" max="120" value="20"><span class="value" id="toleranceV">20</span></div>
<div class="group"><label class="label" for="hue">色相容差</label><input id="hue" type="range" min="0" max="90" value="42"><span class="value" id="hueV">42°</span></div>
<div class="group"><label class="label" for="sat">最低饱和度</label><input id="sat" type="range" min="0" max="100" value="18"><span class="value" id="satV">18%</span></div>
<div class="group"><label class="label" for="dominance">最低主色优势</label><input id="dominance" type="range" min="0" max="100" value="18"><span class="value" id="dominanceV">18</span></div>
<div class="group"><label class="label" for="grayDistance">边缘灰化距离</label><input id="grayDistance" type="range" min="1" max="180" value="44"><span class="value" id="grayDistanceV">44</span></div>
<div class="group"><label class="label" for="grayRadius">灰化半径</label><input id="grayRadius" type="range" min="0" max="8" value="2"><span class="value" id="grayRadiusV">2px</span></div>
<button class="download" id="download" disabled>导出 PNG</button><p class="hint">默认建议：green、色相 42°、最低饱和度 18%。若绿色服装被误删，降低色相容差或提高主色优势。</p><p class="error" id="error"></p><dl class="meta" id="meta"></dl></section>
<section class="preview"><div class="block"><div class="title">原图</div><div class="frame"><img id="source"><div class="placeholder" id="sourcePlaceholder">等待导入</div></div></div><div class="block"><div class="title">抠图结果</div><div class="frame checker"><canvas id="result"></canvas><div class="placeholder" id="resultPlaceholder">等待处理</div></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id), screens={green:[0,255,0],blue:[0,0,255],red:[255,0,0]};let state={image:null,name:'',screen:'auto',manual:'#00ff00',corner:1,cornerThreshold:20,tolerance:20,hue:42,sat:.18,dominance:18,grayDistance:44,grayRadius:2};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),l1=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]),byte=v=>clamp(Math.round(v),0,255);
function hsv(c){let r=c[0]/255,g=c[1]/255,b=c[2]/255,m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n,h=0;if(d){if(m===r)h=60*(((g-b)/d)%6);else if(m===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}return[(h+360)%360,m?d/m:0,m]}
function hd(a,b){let d=Math.abs(a-b);return Math.min(d,360-d)}function median(a){a=[...a].sort((x,y)=>x-y);let n=a.length/2;return a.length%2?a[Math.floor(n)]:(a[n-1]+a[n])/2}function color(a){return [0,1,2].map(i=>byte(median(a.map(x=>x[i]))))}
function corners(im){let s=clamp(Math.floor(state.corner),1,Math.min(im.width,im.height)),p=[[0,0],[im.width-s,0],[0,im.height-s],[im.width-s,im.height-s]];return p.map(([sx,sy])=>{let a=[];for(let y=sy;y<sy+s;y++)for(let x=sx;x<sx+s;x++){let i=(y*im.width+x)*4;a.push([im.data[i],im.data[i+1],im.data[i+2]])}return color(a)})}
function key(im){if(state.screen==='manual')return parse(state.manual);if(state.screen!=='auto')return screens[state.screen];let cs=corners(im),groups=[];for(let c of cs){let g=groups.find(x=>l1(x[0],c)<=state.cornerThreshold);if(g)g.push(c);else groups.push([c])}groups.sort((a,b)=>b.length-a.length);return groups[0].length>=3?color(groups[0]):color(cs)}
function parse(x){x=x.replace('#','');return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]}
function bg(c,k){if(l1(c,k)<=state.tolerance)return true;let [h,s]=hsv(c),[kh]=hsv(k),ch=k.indexOf(Math.max(...k)),others=[0,1,2].filter(i=>i!==ch),dom=c[ch]-Math.max(c[others[0]],c[others[1]]);return s>=state.sat&&dom>=state.dominance&&hd(h,kh)<=state.hue}
function near(mask,w,h,x,y,r){for(let oy=-r;oy<=r;oy++)for(let ox=-r;ox<=r;ox++){let a=x+ox,b=y+oy;if(a>=0&&b>=0&&a<w&&b<h&&mask[b*w+a])return true}return false}
function gray(p,k){let g=byte(p[0]*.299+p[1]*.587+p[2]*.114),ch=k.indexOf(Math.max(...k)),o=[0,1,2].filter(i=>i!==ch),bias=p[ch]-Math.max(p[o[0]],p[o[1]]),d=l1(p,k);if(d>state.grayDistance&&bias<8)return p;let blend=clamp(1-(d-state.tolerance)/Math.max(1,state.grayDistance-state.tolerance),0,1);return [byte(p[0]*(1-blend)+g*blend),byte(p[1]*(1-blend)+g*blend),byte(p[2]*(1-blend)+g*blend),p[3]]}
function process(){if(!state.image)return;let im=state.image,k=key(im),mask=new Uint8Array(im.width*im.height),out=new ImageData(im.width,im.height),count=0;for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++){let n=y*im.width+x,i=n*4,c=[im.data[i],im.data[i+1],im.data[i+2]];if(im.data[i+3]>0&&bg(c,k))mask[n]=1}for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++){let n=y*im.width+x,i=n*4,p=[im.data[i],im.data[i+1],im.data[i+2],im.data[i+3]];if(mask[n]||!p[3]){out.data[i]=out.data[i+1]=out.data[i+2]=out.data[i+3]=0;count++;continue}let q=state.grayRadius&&near(mask,im.width,im.height,x,y,state.grayRadius)?gray(p,k):p;out.data.set(q,i)}let c=$('result');c.width=out.width;c.height=out.height;c.getContext('2d').putImageData(out,0,0);$('resultPlaceholder').hidden=true;$('download').disabled=false;$('download').onclick=()=>{c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=state.name+'_transparent_v2.png';a.click()},'image/png')};$('meta').innerHTML='<div><dt>版本</dt><dd>v2 色相模式</dd></div><div><dt>背景色</dt><dd>'+k.map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()+'</dd></div><div><dt>透明像素</dt><dd>'+count+'</dd></div>'}
function sync(){[['corner','cornerV','px'],['cornerThreshold','cornerThresholdV',''],['tolerance','toleranceV',''],['hue','hueV','°'],['dominance','dominanceV','']].forEach(([a,b,s])=>$(b).textContent=$(a).value+s);$('satV').textContent=$('sat').value+'%';$('grayDistanceV').textContent=$('grayDistance').value;$('grayRadiusV').textContent=$('grayRadius').value+'px';$('manualGroup').hidden=state.screen!=='manual'}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;state.name=f.name.replace(/\.[^.]+$/,'');$('fileLabel').textContent=f.name;$('source').src=URL.createObjectURL(f);$('sourcePlaceholder').hidden=true;let b=await createImageBitmap(f),c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);b.close();let d=c.getContext('2d').getImageData(0,0,c.width,c.height);state.image=d;process()};$('screens').onclick=e=>{if(!e.target.dataset.v)return;state.screen=e.target.dataset.v;document.querySelectorAll('#screens button').forEach(b=>b.classList.toggle('active',b.dataset.v===state.screen));sync();process()};$('manual').oninput=e=>{state.manual=e.target.value;process()};['corner','cornerThreshold','tolerance','hue','sat','dominance','grayDistance','grayRadius'].forEach(id=>$(id).oninput=e=>{state[id]=Number(e.target.value);if(id==='sat')state.sat=Number(e.target.value)/100;sync();process()});sync();
</script></body></html>
